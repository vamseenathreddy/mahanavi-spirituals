name: Mahanavi | Daily blog report (page views vs target)

# Reads the blog page views and prints a report with progress to the target in content/blog/target.json.
# Run it daily (cron-job.org) or on demand. It only reports; nothing is changed.
on:
  workflow_dispatch:

concurrency:
  group: blog-stats
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  blog-stats:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Restore tokens from Google Drive
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          pip install google-auth google-api-python-client
          python scripts/ci/drive_state_sync.py pull
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Report
        env:
          MAHANAVI_BLOGGER_BLOG_ID: ${{ secrets.MAHANAVI_BLOGGER_BLOG_ID }}
          PYTHONPATH: .
        run: python scripts/ci/blog_stats.py
