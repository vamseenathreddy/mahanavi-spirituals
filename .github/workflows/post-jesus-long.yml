name: Jesus | Long Bible Verse Video (Daily 5:30 PM IST)

# Long (8+ minute) English Bible-verse reading with an original ambient pad, for the US audience (higher ad rates than the
# Telugu Shorts). Every day at a random minute in 17:30-18:10 IST (8:00 AM US Eastern).
# Shares data/jesus_state.json with the Shorts (marker key '<date>#long'), so it uses their concurrency group.
# Public by default (owner approved the test video 2026-10-19). One video a day, theme chosen by weekday.
on:
  workflow_dispatch:
    inputs:
      public:
        description: "Upload as public. Turn off to upload unlisted for a test."
        required: false
        type: boolean
        default: true
      dry_run:
        description: "Render only; nothing is uploaded."
        required: false
        type: boolean
        default: false
      bypass_gate:
        description: "Post immediately, ignoring the window and this slot's already-posted marker (testing only)."
        required: false
        type: boolean
        default: false

concurrency:
  group: post-jesus-worship-waves
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  post-jesus-long:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      POST_SLOT: long
      STATE_FILE: data/jesus_state.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install minimal deps for state sync + gate
        run: pip install google-auth google-api-python-client pillow

      - name: Restore persistent state from Google Drive
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/ci/drive_state_sync.py pull

      - name: Decide whether this call should post
        id: gate
        env:
          FORCE_POST: ${{ inputs.bypass_gate && 'true' || 'false' }}
        run: python -m channels.jesus_long.gate

      - name: Install ffmpeg + text shaping libs
        if: steps.gate.outputs.post == 'true'
        run: |
          bash scripts/ci/apt_install.sh ffmpeg libraqm0 libfribidi0 libharfbuzz0b

      - name: Install full Python dependencies
        if: steps.gate.outputs.post == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install edge-tts numpy

      - name: Build and post the long video
        if: steps.gate.outputs.post == 'true'
        env:
          MAHANAVI_JESUS_YOUTUBE_TOKEN_FILE: ./data/youtube_token_jesus.json
          FORCE_POST: ${{ inputs.bypass_gate && 'true' || 'false' }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ inputs.public }}" != "false" ]; then
            ARGS="$ARGS --public"
          fi
          python3 -m channels.jesus_long.post $ARGS

      - name: Push state to Drive
        if: always() && steps.gate.outputs.post == 'true'
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/ci/drive_state_sync.py push

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/ci/notify_failure.py "Jesus | Long Bible Verse Video"
