name: Tools | Analytics probe (read-only)

# Per-day views, subscribers and traffic sources for one saved token; output goes to the same Drive log file.
on:
  workflow_dispatch:
    inputs:
      token_file:
        description: "Saved token to check"
        required: false
        default: "youtube_token_pulse_boosting.json"
      days:
        description: "Days back"
        required: false
        default: "21"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install minimal deps for state sync
        run: pip install google-auth google-api-python-client
      - name: Restore persistent state from Google Drive
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/ci/drive_state_sync.py pull
      - name: Install full Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Probe analytics
        env:
          MAHANAVI_YOUTUBE_TOKEN_FILE: ./data/${{ inputs.token_file }}
        run: |
          set -o pipefail
          python3 scripts/ci/analytics_probe.py "${{ inputs.days }}" 2>&1 | tee data/recent_uploads_log.txt
      - name: Push output log to Drive
        if: always()
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/ci/push_drive_asset.py data/recent_uploads_log.txt recent_uploads_log.txt
