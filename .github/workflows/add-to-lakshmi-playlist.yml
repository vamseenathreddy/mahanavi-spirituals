name: Tools | Add Video To Lakshmi Playlist

# One-off repair: adds a video to the Lakshmi 108 Names playlist when the post run could not (idempotent).
on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "YouTube video id to add"
        required: true
      lang:
        description: "en for Mahanavi (Telugu), hi for the Hindi channel"
        required: false
        default: "en"
      token_file:
        description: "Saved token (default youtube_token.json)"
        required: false
        default: "youtube_token.json"

permissions:
  contents: read

jobs:
  add-to-playlist:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install minimal deps for state sync
        run: pip install google-auth google-api-python-client

      - name: Restore persistent state from Google Drive
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/ci/drive_state_sync.py pull

      - name: Install full Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Add to playlist
        env:
          MAHANAVI_YOUTUBE_TOKEN_FILE: ./data/${{ inputs.token_file || 'youtube_token.json' }}
        run: python3 scripts/ci/add_to_lakshmi_playlist.py "${{ inputs.video_id }}" "${{ inputs.lang }}"
