name: Trance Beats | Purana Concept Short (11 AM IST, alternate days)

# Hindi Purana Concept on Devotional Trance Beats, every other day, random minute and second between 11:00 and 12:40 IST.
# State marker in beej_state_trance.json under POST_SLOT=purana_hi_trance. Fresh-only (used registry in Drive).
on:
  workflow_dispatch:
    inputs:
      public:
        description: "Upload as public. Uncheck for an unlisted test run."
        required: false
        type: boolean
        default: true
      bypass_gate:
        description: "Post immediately, ignoring the window and today's already-posted marker (testing)."
        required: false
        type: boolean
        default: false
      index:
        description: "Testing only: force this concept index (the used registry is NOT updated). Blank = next fresh concept."
        required: false
        default: ''

concurrency:
  group: post-purana-hindi-trance
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  post-chanakya:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install minimal deps for state sync + gate
        run: pip install google-auth google-api-python-client

      - name: Restore persistent state from Google Drive
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/ci/drive_state_sync.py pull

      - name: Decide whether this call should post today
        id: gate
        env:
          STATE_FILE: data/beej_state_trance.json
          POST_SLOT: purana_hi_trance
          FORCE_POST: ${{ inputs.bypass_gate && 'true' || 'false' }}
        run: python -m channels.purana_hindi_plan --channel trance

      - name: Install ffmpeg + text shaping libs
        if: steps.gate.outputs.post == 'true'
        run: bash scripts/ci/apt_install.sh ffmpeg libraqm0 libfribidi0 libharfbuzz0b

      - name: Install full Python dependencies
        if: steps.gate.outputs.post == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Build and upload the Purana Concept Short
        if: steps.gate.outputs.post == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATE_FILE: data/beej_state_trance.json
          POST_SLOT: purana_hi_trance
          MAHANAVI_IMAGES_ROOT: ./Images
          MAHANAVI_ASSETS_DIR: ./assets
          MAHANAVI_OUTPUT_DIR: ./data/generated
          MAHANAVI_DATABASE_PATH: ./data/mahanavi.db
          MAHANAVI_LOG_DIR: ./data/logs
          MAHANAVI_TIMEZONE: Asia/Kolkata
          MAHANAVI_YOUTUBE_TOKEN_FILE: ./data/youtube_token_trance_beats.json
        run: |
          ARGS="--channel trance"
          if [ "${{ inputs.public }}" != "false" ]; then ARGS="$ARGS --public"; fi
          if [ -n "${{ inputs.index }}" ]; then ARGS="$ARGS --index ${{ inputs.index }}"; fi
          python3 -m mahanavi.scripts.post_purana_hindi $ARGS

      - name: Push state to Drive
        if: always() && steps.gate.outputs.post == 'true'
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/ci/drive_state_sync.py push

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/ci/notify_failure.py "Trance Beats | Purana Concept Short (11 AM IST)"
