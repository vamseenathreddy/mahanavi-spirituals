name: Mahanavi | Day-wise God Live (4 AM to ~9:45 AM IST)

# Triggered by cron-job.org about 3:53 AM IST (GitHub schedules are unreliable). God by IST weekday:
# Mon Shiva, Tue Hanuman, Wed Ganesha, Thu Dattatreya, Fri Lakshmi, Sat Venkateswara, Sun Surya.
# Only gods listed in approved_gods (data/lakshmi_live.json) go live; add a god there once the owner approves its video.
# To stop: set "enabled": false in data/lakshmi_live.json.
on:
  workflow_dispatch:
    inputs:
      god:
        description: "Override the weekday god (blank = by weekday)."
        required: false
        type: string
        default: ""
      test:
        description: "Private 2-minute test stream (nothing public)."
        type: boolean
        default: false

concurrency:
  group: god-live
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Decide god and gate
        id: gate
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, datetime as d
          c = json.load(open("data/lakshmi_live.json"))
          now = d.datetime.utcnow() + d.timedelta(hours=5, minutes=30)
          W = {0: "shiva", 1: "hanuman", 2: "ganesha", 3: "dattatreya", 4: "lakshmi", 5: "venkateswara", 6: "surya"}
          god = "${{ inputs.god }}" or W[now.weekday()]
          print("god=" + god)
          ok = c.get("enabled") and now.date().isoformat() >= c["start_date"] and god in c.get("approved_gods", [])
          print("run=" + ("true" if ok else "false"))
          PY
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true' || inputs.test == true
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Restore tokens from Google Drive
        if: steps.gate.outputs.run == 'true' || inputs.test == true
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          pip install google-auth google-api-python-client pillow
          python scripts/ci/drive_state_sync.py pull
      - name: Install dependencies
        if: steps.gate.outputs.run == 'true' || inputs.test == true
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          command -v ffmpeg >/dev/null || bash scripts/ci/apt_install.sh ffmpeg
      - name: Fetch video
        if: steps.gate.outputs.run == 'true' || inputs.test == true
        run: |
          set -e
          GOD="${{ steps.gate.outputs.god }}"
          if [ "$GOD" = "lakshmi" ]; then
            bash scripts/ci/lakshmi_long_assets.sh
          else
            git fetch --depth 1 origin "assets-live-$GOD"
            mkdir -p "build/live/$GOD"
            git archive FETCH_HEAD | tar -x -C "build/live/$GOD"
            cat build/live/$GOD/loop.mp4.part* > "build/live/$GOD/loop.mp4"
          fi
      - name: Go live
        if: steps.gate.outputs.run == 'true' || inputs.test == true
        env:
          PYTHONPATH: .
        run: python scripts/ci/god_live.py "${{ steps.gate.outputs.god }}" ${{ inputs.test && '--test' || '' }}
