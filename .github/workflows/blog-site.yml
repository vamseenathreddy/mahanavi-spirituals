name: Mahanavi | Extra blogs - schedule posts and link related

# Schedules the next unpublished posts of content/sites/<site>/ (3 a day at random times), then fills the Related reading blocks.
on:
  workflow_dispatch:
    inputs:
      site:
        description: "Site folder under content/sites/"
        required: true
        default: "purana"
      days:
        description: "Schedule posts up to this many days ahead"
        required: false
        default: "7"
      relink:
        description: "Only fill the Related reading blocks with real post links"
        required: false
        type: boolean
        default: false
      apply:
        description: "Post for real (off = only list)"
        required: false
        type: boolean
        default: true

concurrency:
  group: blog-site-${{ inputs.site }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  blog-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Restore tokens from Google Drive
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          pip install google-auth google-api-python-client
          python scripts/ci/drive_state_sync.py pull
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Schedule posts
        env:
          PYTHONPATH: .
          MAHANAVI_BLOGGER_BLOG_ID: ${{ secrets.MAHANAVI_BLOGGER_BLOG_ID }}
        run: |
          python scripts/ci/blog_site.py --site "${{ inputs.site }}" --days "${{ inputs.days }}" ${{ inputs.apply && '--apply' || '' }}
          python scripts/ci/blog_site.py --site "${{ inputs.site }}" --relink ${{ inputs.apply && '--apply' || '' }}
