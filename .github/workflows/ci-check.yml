name: Tools | CI Check (ffmpeg install)

# Quick health check: can the runner install the packages every posting workflow needs?
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg + text shaping libs
        run: bash scripts/ci/apt_install.sh ffmpeg libraqm0 libfribidi0 libharfbuzz0b
      - name: Show versions
        run: |
          ffmpeg -version | head -1
          lsb_release -d
