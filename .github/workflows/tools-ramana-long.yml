name: Ramana | Self-Enquiry Long Video (manual)

# One-off 10-minute guided Self-enquiry video. Private by default so the owner can review it in Studio, then publish.
on:
  workflow_dispatch:
    inputs:
      public:
        description: "Upload as public (default private for review)."
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Render only; nothing is uploaded."
        required: false
        type: boolean
        default: false

concurrency:
  group: post-ramana
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Restore tokens from Google Drive
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          pip install google-auth google-api-python-client pillow
          python scripts/ci/drive_state_sync.py pull
      - name: Install ffmpeg + text shaping libs
        run: bash scripts/ci/apt_install.sh ffmpeg libraqm0 libfribidi0 libharfbuzz0b
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install edge-tts numpy
      - name: Build and upload
        env:
          MAHANAVI_RAMANA_YOUTUBE_TOKEN_FILE: ./data/youtube_token_ramana.json
        run: |
          ARGS=""
          [ "${{ inputs.public }}" = "true" ] && ARGS="$ARGS --public"
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          python -m channels.ramana_long.post $ARGS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ramana-long
          path: |
            out_ramana_long/meta.json
            out_ramana_long/thumb.png
