name: Mahanavi | Build long explainer video (manual, sample only, nothing is uploaded)

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "content/long/<slug>.md"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install dependencies
        run: |
          command -v ffmpeg >/dev/null || bash scripts/ci/apt_install.sh ffmpeg libraqm0 libfribidi0 libharfbuzz0b
          pip install pillow numpy edge-tts
      - name: Build video
        run: python scripts/ci/long_video_build.py "${{ inputs.slug }}"
      - name: Publish sample to assets branch
        run: |
          set -e
          B="assets-long-${{ inputs.slug }}"
          D=$(mktemp -d)
          split -b 90m -d build/long/${{ inputs.slug }}/video.mp4 "$D/video.mp4.part"
          cd "$D"
          git init -q -b "$B"
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A; git commit -qm "sample ${{ inputs.slug }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "$B"
