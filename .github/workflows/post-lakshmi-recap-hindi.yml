name: Devotional Trance Beats | Lakshmi 108 Friday Recap Short (10 AM IST)

# Hindi version of the Lakshmi 108 names series for Devotional Trance Beats (same plan: name 1 on Fri 6 Nov 2026).
# Day-seeded random minute and second; state marker in beej_state_trance.json under POST_SLOT=lakshmi_recap_hi.
on:
  workflow_dispatch:
    inputs:
      public:
        description: "Upload as public. Uncheck for an unlisted test run."
        required: false
        type: boolean
        default: true
      bypass_gate:
        description: "Post immediately, ignoring the window and today's already-posted marker (testing)."
        required: false
        type: boolean
        default: false
      date:
        description: "Optional ISO date to build the Short for (testing). Blank = today."
        required: false
        default: ''

concurrency:
  group: post-lakshmi-recap-hindi
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  post-lakshmi:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install minimal deps for state sync + gate
        run: pip install google-auth google-api-python-client

      - name: Restore persistent state from Google Drive
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/ci/drive_state_sync.py pull

      - name: Decide whether this call should post today
        id: gate
        env:
          STATE_FILE: data/beej_state_trance.json
          POST_SLOT: lakshmi_recap_hi
          FORCE_POST: ${{ inputs.bypass_gate && 'true' || 'false' }}
        run: python -m channels.lakshmi108_plan --kind recap --lang hi

      - name: Install ffmpeg + text shaping libs
        if: steps.gate.outputs.post == 'true'
        run: bash scripts/ci/apt_install.sh ffmpeg libraqm0 libfribidi0 libharfbuzz0b

      - name: Install full Python dependencies
        if: steps.gate.outputs.post == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Build and upload the Lakshmi 108 Short
        if: steps.gate.outputs.post == 'true'
        env:
          STATE_FILE: data/beej_state_trance.json
          POST_SLOT: lakshmi_recap_hi
          MAHANAVI_IMAGES_ROOT: ./Images
          MAHANAVI_ASSETS_DIR: ./assets
          MAHANAVI_OUTPUT_DIR: ./data/generated
          MAHANAVI_DATABASE_PATH: ./data/mahanavi.db
          MAHANAVI_LOG_DIR: ./data/logs
          MAHANAVI_TIMEZONE: Asia/Kolkata
          MAHANAVI_YOUTUBE_TOKEN_FILE: ./data/youtube_token_trance_beats.json
        run: |
          ARGS="--kind recap --lang hi"
          if [ "${{ inputs.public }}" != "false" ]; then ARGS="$ARGS --public"; fi
          if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date ${{ inputs.date }}"; fi
          python3 -m mahanavi.scripts.post_lakshmi_name $ARGS

      - name: Push state to Drive
        if: always() && steps.gate.outputs.post == 'true'
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/ci/drive_state_sync.py push

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/ci/notify_failure.py "Trance Beats | Lakshmi 108 Friday Recap Short (10 AM IST)"
