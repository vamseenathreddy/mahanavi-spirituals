name: Tools | Campaign Shorts Admin (Pulse TDP Fans)

# Uploads the day's planned Chatrai campaign Shorts (4 a day, 24 Nov to 4 Dec) as scheduled publishes.
# Videos live on the assets branch; the plan is content/campaign/shorts_plan.json.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "IST date YYYY-MM-DD"
        required: true
      delete:
        description: "Slot numbers to delete, e.g. 3,4"
        required: false
        default: ""
      refresh:
        description: "true = rewrite descriptions and tags from the plan"
        required: false
        default: "false"
      token_file:
        required: false
        default: "youtube_token_pulse_boosting.json"

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - run: pip install google-auth google-api-python-client
      - name: Restore persistent state from Google Drive
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/ci/drive_state_sync.py pull
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Apply changes
        env:
          MAHANAVI_OUTPUT_DIR: ./data/generated
          MAHANAVI_DATABASE_PATH: ./data/mahanavi.db
          MAHANAVI_LOG_DIR: ./data/logs
          MAHANAVI_TIMEZONE: Asia/Kolkata
          MAHANAVI_YOUTUBE_TOKEN_FILE: ./data/${{ inputs.token_file }}
        run: |
          python3 scripts/ci/campaign_shorts_admin.py --date "${{ inputs.date }}" --delete "${{ inputs.delete }}" $([ "${{ inputs.refresh }}" = true ] && echo --refresh)
      - name: Push state to Drive
        if: always()
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/ci/drive_state_sync.py push
