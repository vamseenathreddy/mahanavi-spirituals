name: Mahanavi | Gold rate for blog ticker
on:
  workflow_dispatch:
  schedule:
    - cron: "40 1,5,9 * * *"
permissions:
  contents: write
concurrency:
  group: gold-rate
  cancel-in-progress: false
jobs:
  gold:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/ci/gold_rate.py
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/gold.json
          git diff --cached --quiet || (git commit -m "gold rate" && git pull --rebase -q && git push -q)
