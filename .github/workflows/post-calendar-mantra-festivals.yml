name: Mantra Sangam | Hindi Monthly Festival List (7 PM IST)

# 28th of each month: next month's festival list. cron-job.org pings every 10 min. Posts PUBLIC by default.
on:
  workflow_dispatch:
    inputs:
      public:
        description: "Upload as public. Uncheck for a private test run."
        required: false
        type: boolean
        default: true
      bypass_gate:
        description: "Post immediately, ignoring the window and today's already-posted marker (testing)."
        required: false
        type: boolean
        default: false
      date:
        description: "Optional ISO date to treat as today (testing). Blank = today."
        required: false
        default: ''

concurrency:
  group: post-calendar-mantra-sangam
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  post-calendar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install minimal deps for state sync + gate
        run: pip install google-auth google-api-python-client

      - name: Restore persistent state from Google Drive
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/ci/drive_state_sync.py pull

      - name: Install full Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Decide whether this call should post today
        id: gate
        env:
          STATE_FILE: data/beej_state_mantra_sangam.json
          CAL_KIND: festivals
          CAL_CHANNEL: mantra_sangam
          POST_SLOT: cal_festivals
          FORCE_POST: ${{ inputs.bypass_gate && 'true' || 'false' }}
        run: python -m channels.calendar.gate

      - name: Install ffmpeg + text shaping libs
        if: steps.gate.outputs.post == 'true'
        run: bash scripts/ci/apt_install.sh ffmpeg libraqm0 libfribidi0 libharfbuzz0b

      - name: Build and upload the calendar Short
        if: steps.gate.outputs.post == 'true'
        env:
          STATE_FILE: data/beej_state_mantra_sangam.json
          POST_SLOT: cal_festivals
          MAHANAVI_IMAGES_ROOT: ./Images
          MAHANAVI_ASSETS_DIR: ./assets
          MAHANAVI_OUTPUT_DIR: ./data/generated
          MAHANAVI_DATABASE_PATH: ./data/mahanavi.db
          MAHANAVI_LOG_DIR: ./data/logs
          MAHANAVI_TIMEZONE: Asia/Kolkata
          MAHANAVI_YOUTUBE_TOKEN_FILE: ./data/youtube_token_mantra_sangam.json
        run: |
          ARGS="--kind festivals --channel mantra_sangam"
          if [ "${{ inputs.public }}" != "false" ]; then ARGS="$ARGS --public"; else ARGS="$ARGS --private"; fi
          if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date ${{ inputs.date }}"; fi
          python3 -m mahanavi.scripts.post_calendar_short $ARGS

      - name: Push state to Drive
        if: always() && steps.gate.outputs.post == 'true'
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/ci/drive_state_sync.py push

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/ci/notify_failure.py "Mantra Sangam | Monthly Festival List Short (28th, 7 PM IST)"
