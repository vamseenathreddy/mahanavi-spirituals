name: Mahanavi | Repair IFTTT-made blog posts (in place, no deletions)
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Patch for real (off = report only)"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  list:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Restore tokens from Google Drive
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          pip install google-auth google-api-python-client
          python scripts/ci/drive_state_sync.py pull
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Repair
        env:
          PYTHONPATH: .
        run: python scripts/ci/blog_repair.py ${{ inputs.apply && '--apply' || '' }}
