name: Mahanavi | Extra blogs - daily top-up (English and Hindi, 4 posts a day)

# Schedules the next unpublished posts of content/sites/<site>/ (3 a day at random times), then fills the Related reading blocks.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blog-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        site: [purana, purana_hi]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Restore tokens from Google Drive
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          pip install google-auth google-api-python-client
          python scripts/ci/drive_state_sync.py pull
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Schedule posts
        env:
          PYTHONPATH: .
          MAHANAVI_BLOGGER_BLOG_ID: ${{ secrets.MAHANAVI_BLOGGER_BLOG_ID }}
        run: |
          python scripts/ci/blog_site.py --site "${{ matrix.site }}" --days 3 --apply
          python scripts/ci/blog_site.py --site "${{ matrix.site }}" --relink --apply
