name: Mahanavi | Build god chant loop for live (manual)

on:
  workflow_dispatch:
    inputs:
      god:
        description: "shiva, hanuman, ganesha, dattatreya, venkateswara or surya"
        required: true
        type: string

concurrency:
  group: god-live-build-${{ inputs.god }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install dependencies
        run: |
          bash scripts/ci/apt_install.sh ffmpeg
          pip install pillow numpy edge-tts
      - name: Build loop
        run: python scripts/ci/god_live_build.py "${{ inputs.god }}"
      - name: Publish to assets branch
        run: |
          set -e
          B="assets-live-${{ inputs.god }}"
          D=$(mktemp -d)
          cp build/live/${{ inputs.god }}/loop.mp4 build/live/${{ inputs.god }}/thumb.jpg "$D/"
          split -b 90m -d "$D/loop.mp4" "$D/loop.mp4.part" && rm "$D/loop.mp4"
          cd "$D"
          git init -q -b "$B"
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A; git commit -qm "loop for ${{ inputs.god }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "$B"
