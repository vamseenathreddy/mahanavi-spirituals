name: Tools | Post Campaign Shorts (Pulse TDP Fans)

# Uploads the day's planned Chatrai campaign Shorts (4 a day, 24 Nov to 4 Dec) as scheduled publishes.
# Videos live on the assets branch; the plan is content/campaign/shorts_plan.json.
on:
  schedule:
    - cron: "30 0 * * *"        # 06:00 IST, before the 07:00 slot
  workflow_dispatch:
    inputs:
      date:
        description: "IST date YYYY-MM-DD (blank = today)"
        required: false
        default: ""
      only:
        description: "Only these slot numbers, e.g. 1,2 (blank = all four)"
        required: false
        default: ""
      assets_branch:
        required: false
        default: "assets-campaign-shorts"
      token_file:
        required: false
        default: "youtube_token_pulse_boosting.json"

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.assets_branch || 'assets-campaign-shorts' }}
          path: assets_in
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - run: pip install google-auth google-api-python-client
      - name: Restore persistent state from Google Drive
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/ci/drive_state_sync.py pull
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Upload the day's Shorts
        env:
          MAHANAVI_OUTPUT_DIR: ./data/generated
          MAHANAVI_DATABASE_PATH: ./data/mahanavi.db
          MAHANAVI_LOG_DIR: ./data/logs
          MAHANAVI_TIMEZONE: Asia/Kolkata
          MAHANAVI_YOUTUBE_TOKEN_FILE: ./data/${{ inputs.token_file || 'youtube_token_pulse_boosting.json' }}
        run: |
          python3 scripts/ci/upload_campaign_shorts.py assets_in --date "${{ inputs.date }}" --only "${{ inputs.only }}"
      - name: Push state to Drive
        if: always()
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/ci/drive_state_sync.py push
