name: Mahanavi | Update Lakshmi video metadata (manual)

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "YouTube video id"
        required: true
        type: string

concurrency:
  group: lakshmi-meta
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Restore tokens from Google Drive
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          pip install google-auth google-api-python-client pillow
          python scripts/ci/drive_state_sync.py pull
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Update
        env:
          PYTHONPATH: .
        run: python scripts/ci/update_lakshmi_meta.py "${{ inputs.video_id }}"
