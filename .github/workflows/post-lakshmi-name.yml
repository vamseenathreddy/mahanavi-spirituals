name: Mahanavi | Lakshmi 108 Names Short (6 PM IST)

# From Mon 9 Nov 2026 the Telugu name posts 2:00-2:50 PM IST (owner request); before that 6-7:40 PM.
# Sri Lakshmi Devi 108 Names: one name a day (1..108) from Fri 6 Nov 2026 to Sun 21 Feb 2027, public, at a day-seeded random
# minute and second between 6:00 and 7:40 PM IST (channels/lakshmi108_plan.py). cron-job.org pings every 10 min 6-8 PM IST.
# The state marker is the Mahanavi beej state file under POST_SLOT=lakshmi (no new Drive file).
on:
  workflow_dispatch:
    inputs:
      public:
        description: "Upload as public. Uncheck for an unlisted test run."
        required: false
        type: boolean
        default: true
      bypass_gate:
        description: "Post immediately, ignoring the window and today's already-posted marker (testing)."
        required: false
        type: boolean
        default: false
      date:
        description: "Optional ISO date to build the Short for (testing). Blank = today."
        required: false
        default: ''

concurrency:
  group: post-lakshmi-name
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  post-lakshmi:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install minimal deps for state sync + gate
        run: pip install google-auth google-api-python-client

      - name: Restore persistent state from Google Drive
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/ci/drive_state_sync.py pull

      - name: Decide whether this call should post today
        id: gate
        env:
          STATE_FILE: data/beej_state_mahanavi.json
          POST_SLOT: lakshmi
          FORCE_POST: ${{ inputs.bypass_gate && 'true' || 'false' }}
        run: python -m channels.lakshmi108_plan --kind name

      - name: Install ffmpeg + text shaping libs
        if: steps.gate.outputs.post == 'true'
        run: bash scripts/ci/apt_install.sh ffmpeg libraqm0 libfribidi0 libharfbuzz0b

      - name: Install full Python dependencies
        if: steps.gate.outputs.post == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Build and upload the Lakshmi 108 Short
        if: steps.gate.outputs.post == 'true'
        env:
          STATE_FILE: data/beej_state_mahanavi.json
          POST_SLOT: lakshmi
          MAHANAVI_IMAGES_ROOT: ./Images
          MAHANAVI_ASSETS_DIR: ./assets
          MAHANAVI_OUTPUT_DIR: ./data/generated
          MAHANAVI_DATABASE_PATH: ./data/mahanavi.db
          MAHANAVI_LOG_DIR: ./data/logs
          MAHANAVI_TIMEZONE: Asia/Kolkata
          MAHANAVI_YOUTUBE_TOKEN_FILE: ./data/youtube_token.json
          MAHANAVI_BLOGGER_BLOG_ID: ${{ secrets.MAHANAVI_BLOGGER_BLOG_ID }}
        run: |
          ARGS="--kind name"
          if [ "${{ inputs.public }}" != "false" ]; then ARGS="$ARGS --public"; fi
          if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date ${{ inputs.date }}"; fi
          python3 -m mahanavi.scripts.post_lakshmi_name $ARGS

      - name: Push state to Drive
        if: always() && steps.gate.outputs.post == 'true'
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/ci/drive_state_sync.py push

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/ci/notify_failure.py "Mahanavi | Lakshmi 108 Names Short (6 PM IST)"
