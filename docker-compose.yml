# Convenience wrapper around the Dockerfile for local or single-host
# production deployment. Not required — `docker run` works fine too —
# but this saves re-typing volume mounts and env-file flags every time.
#
# Usage:
#   docker compose up -d          # start the scheduler, runs forever
#   docker compose run --rm app python -m mahanavi.main --run-now
#   docker compose logs -f

services:
  app:
    build: .
    container_name: mahanavi-spirituals
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./Images:/app/Images
      - ./assets:/app/assets   # override the bundled font/logo if you want your own
    # If you're running the YouTube Playwright uploader, run
    # scripts/youtube_login_setup.py OUTSIDE Docker first (it needs a
    # visible browser window for you to log in), then mount the resulting
    # session file in via the data/ volume above.
