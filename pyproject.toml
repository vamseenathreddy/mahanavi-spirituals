[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mahanavi-spirituals"
version = "0.1.0"
description = "Automated daily Hindu devotional content pipeline for YouTube Community Posts."
requires-python = ">=3.13"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v --cov=mahanavi --cov-report=term-missing"

[tool.mypy]
python_version = "3.13"
disallow_untyped_defs = true
warn_return_any = true
ignore_missing_imports = true
